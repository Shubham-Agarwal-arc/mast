services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: mast
      POSTGRES_USER: mast
      POSTGRES_PASSWORD: mast
    ports:
      - "5432:5432"
    volumes:
      - mast-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mast -d mast"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  mast-postgres-data: